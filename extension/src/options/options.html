<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="options.css"><title>ODL 設定</title></head><body><main><h1>Obsidian Daily Logger 設定</h1><form id="form"><fieldset><legend>Local Service</legend><label>Host<input name="host" value="127.0.0.1" readonly></label><label>Port<input name="port" type="number" value="8765"></label><label>認証トークン<input name="authToken" type="password" autocomplete="off"></label><button type="button" id="testConnection">Connection Test</button></fieldset><fieldset><legend>Obsidian</legend><label>Vault Path<input name="vaultPath"></label><label>Daily Notes Folder<input name="dailyNotesDirectory"></label><label>Filename Format<input name="dailyNoteFormat" readonly></label><button type="button" id="testVault">Test Vault</button></fieldset><fieldset><legend>Summary</legend><label>Timezone<input name="timezone"></label><label>Day Boundary<input name="dayBoundaryHour" type="number" min="0" max="23"></label><label><input name="autoRun" type="checkbox"> Auto Summary</label><label>Summary Time<input name="runAt" type="time"></label><label>Model<input name="model" placeholder="OPENAI_MODELも使用可能"></label></fieldset><button type="submit">設定を保存</button><button type="button" id="summarize">今日のノートを生成</button><p id="message" role="status"></p></form></main><script type="module" src="options.js"></script></body></html>
